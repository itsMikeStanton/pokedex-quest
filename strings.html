<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📝 Lukeymon Strings</title>
<style>
 :root{--bg:#0c1422;--panel:#13203a;--line:#27406a;--ink:#dce8f8;--gold:#f8d860;}
 *{box-sizing:border-box;} body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);}
 header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:2px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
 h1{font-size:16px;margin:0;color:var(--gold);} .spacer{flex:1;}
 input,button,select{font:inherit;} #q{flex:1;min-width:160px;background:#0c1830;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 10px;}
 select{background:#0c1830;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 9px;}
 .btn{background:#2a7d4a;border:1px solid #3fae6a;color:#fff;border-radius:6px;padding:7px 12px;cursor:pointer;}
 .count{font-size:12px;color:#9fb6d4;}
 main{padding:12px;max-width:900px;margin:0 auto;}
 .sec{margin-bottom:18px;} .sec h2{font-size:13px;color:#7fc8f8;border-bottom:1px solid var(--line);padding-bottom:4px;}
 .row{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:7px 0;}
 .row .lbl{font-size:12px;color:var(--gold);} .row .desc{font-size:11px;color:#9fb6d4;margin:2px 0 5px;}
 .row .file{font-size:10px;color:#6f86a6;float:right;}
 textarea{width:100%;background:#0a1322;color:#cfe;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;padding:7px;resize:vertical;min-height:38px;}
 .row.changed{border-color:var(--gold);} .row.changed textarea{background:#1a1606;}
 #out{width:100%;height:200px;background:#0a1322;color:#bcd;border:1px solid var(--line);border-radius:6px;font-family:ui-monospace,monospace;font-size:11px;padding:8px;margin-top:8px;}
 .hint{font-size:12px;color:#9fb6d4;line-height:1.5;}
</style></head><body>
<header>
 <h1>📝 Game Strings</h1>
 <input id="q" placeholder="Search text, label, or category…">
 <select id="cat"><option value="">All categories</option></select>
 <span class="count" id="count"></span>
 <span class="spacer"></span>
 <button class="btn" id="export">📋 Export my edits</button>
</header>
<main>
 <p class="hint">Every word in the game is below, grouped by what it is. <b>Edit any box</b> to change the wording — edited rows turn gold. When you're done, hit <b>Export my edits</b> and paste the result back to me (or into the listed file). <code>${saveName}</code> is replaced by the player's name; emoji are fine.</p>
 <div id="list"></div>
 <textarea id="out" readonly placeholder="Your edits will appear here after you click Export…"></textarea>
</main>

kémon names","label":"#061 name","desc":"The name shown for Pokémon #61","file":"data.js","text":"Poliwhirl"},{"cat":"Pokédex descriptions","label":"#061 Poliwhirl","desc":"Pokédex entry text for Poliwhirl","file":"data.js","text":"The swirl on its belly hypnotizes anyone who stares too long! Capable of living on land or in water."},{"cat":"Pokémon names","label":"#062 name","desc":"The name shown for Pokémon #62","file":"data.js","text":"Poliwrath"},{"cat":"Pokédex descriptions","label":"#062 Poliwrath","desc":"Pokédex entry text for Poliwrath","file":"data.js","text":"An incredibly strong swimmer — it can cross the entire Pacific Ocean without ever coming up to rest."},{"cat":"Pokémon names","label":"#063 name","desc":"The name shown for Pokémon #63","file":"data.js","text":"Abra"},{"cat":"Pokédex descriptions","label":"#063 Abra","desc":"Pokédex entry text for Abra","file":"data.js","text":"It sleeps 18 hours a day. Even while sleeping it senses danger and can teleport to safety."},{"cat":"Pokémon names","label":"#064 name","desc":"The name shown for Pokémon #64","file":"data.js","text":"Kadabra"},{"cat":"Pokédex descriptions","label":"#064 Kadabra","desc":"Pokédex entry text for Kadabra","file":"data.js","text":"It emits special waves from its body that can induce headaches in anyone standing close."},{"cat":"Pokémon names","label":"#065 name","desc":"The name shown for Pokémon #65","file":"data.js","text":"Alakazam"},{"cat":"Pokédex descriptions","label":"#065 Alakazam","desc":"Pokédex entry text for Alakazam","file":"data.js","text":"Its brain can outperform a supercomputer! It never forgets anything it has experienced in its lifetime."},{"cat":"Pokémon names","label":"#066 name","desc":"The name shown for Pokémon #66","file":"data.js","text":"Machop"},{"cat":"Pokédex descriptions","label":"#066 Machop","desc":"Pokédex entry text for Machop","file":"data.js","text":"Its whole body is composed of pure muscle. Child-sized, but strong enough to throw 100 adults."},{"cat":"Pokémon names","label":"#067 name","desc":"The name shown for Pokémon #67","file":"data.js","text":"Machoke"},{"cat":"Pokédex descriptions","label":"#067 Machoke","desc":"Pokédex entry text for Machoke","file":"data.js","text":"Its muscular body is so powerful it must wear a belt to keep its energy in check."},{"cat":"Pokémon names","label":"#068 name","desc":"The name shown for Pokémon #68","file":"data.js","text":"Machamp"},{"cat":"Pokédex descriptions","label":"#068 Machamp","desc":"Pokédex entry text for Machamp","file":"data.js","text":"With four arms that move faster than the eye, it throws a thousand punches in two seconds."},{"cat":"Pokémon names","label":"#069 name","desc":"The name shown for Pokémon #69","file":"data.js","text":"Bellsprout"},{"cat":"Pokédex descriptions","label":"#069 Bellsprout","desc":"Pokédex entry text for Bellsprout","file":"data.js","text":"A thin body lets it bend and sway to avoid attacks, then lash out with its vine-like arms."},{"cat":"Pokémon names","label":"#070 name","desc":"The name shown for Pokémon #70","file":"data.js","text":"Weepinbell"},{"cat":"Pokédex descriptions","label":"#070 Weepinbell","desc":"Pokédex entry text for Weepinbell","file":"data.js","text":"It traps prey by dousing them with acid. The razor-sharp leaves slice anything that tries to escape!"},{"cat":"Pokémon names","label":"#071 name","desc":"The name shown for Pokémon #71","file":"data.js","text":"Victreebel"},{"cat":"Pokédex descriptions","label":"#071 Victreebel","desc":"Pokédex entry text for Victreebel","file":"data.js","text":"Lures prey with a honey-sweet aroma, then snares them. Few who are caught ever escape its grasp."},{"cat":"Pokémon names","label":"#072 name","desc":"The name shown for Pokémon #72","file":"data.js","text":"Tentacool"},{"cat":"Pokédex descriptions","label":"#072 Tentacool","desc":"Pokédex entry text for Tentacool","file":"data.js","text":"Its body is almost entirely water. It floats in warm seas and stings with its tentacles."},{"cat":"Pokémon names","label":"#073 name","desc":"The name shown for Pokémon #73","file":"data.js","text":"Tentacruel"},{"cat":"Pokédex descriptions","label":"#073 Tentacruel","desc":"Pokédex entry text for Tentacruel","file":"data.js","text":"Its 80 tentacles can stretch far to reach prey. It stuns them with venom then drags them into the deep!"},{"cat":"Pokémon names","label":"#074 name","desc":"The name shown for Pokémon #74","file":"data.js","text":"Geodude"},{"cat":"Pokédex descriptions","label":"#074 Geodude","desc":"Pokédex entry text for Geodude","file":"data.js","text":"Sleeps deeply in fields and on mountain paths. Hikers often trip over them by mistake."},{"cat":"Pokémon names","label":"#075 name","desc":"The name shown for Pokémon #75","file":"data.js","text":"Graveler"},{"cat":"Pokédex descriptions","label":"#075 Graveler","desc":"Pokédex entry text for Graveler","file":"data.js","text":"It rolls down mountain slopes to move. It happily eats rocks and boulders as it goes — even granite!"},{"cat":"Pokémon names","label":"#076 name","desc":"The name shown for Pokémon #76","file":"data.js","text":"Golem"},{"cat":"Pokédex descriptions","label":"#076 Golem","desc":"Pokédex entry text for Golem","file":"data.js","text":"Once a year it sheds its boulder-like shell and grows larger. Old shells crumble into soil."},{"cat":"Pokémon names","label":"#077 name","desc":"The name shown for Pokémon #77","file":"data.js","text":"Ponyta"},{"cat":"Pokédex descriptions","label":"#077 Ponyta","desc":"Pokédex entry text for Ponyta","file":"data.js","text":"Its legs are as taut as coiled springs. It becomes stronger by jumping over the grass in its habitat."},{"cat":"Pokémon names","label":"#078 name","desc":"The name shown for Pokémon #78","file":"data.js","text":"Rapidash"},{"cat":"Pokédex descriptions","label":"#078 Rapidash","desc":"Pokédex entry text for Rapidash","file":"data.js","text":"Fiery legs let this horse gallop at 150 mph! Once it starts galloping it only picks up more speed."},{"cat":"Pokémon names","label":"#079 name","desc":"The name shown for Pokémon #79","file":"data.js","text":"Slowpoke"},{"cat":"Pokédex descriptions","label":"#079 Slowpoke","desc":"Pokédex entry text for Slowpoke","file":"data.js","text":"Incredibly slow and dopey. It takes 5 seconds to feel pain when its tail gets bitten."},{"cat":"Pokémon names","label":"#080 name","desc":"The name shown for Pokémon #80","file":"data.js","text":"Slowbro"},{"cat":"Pokédex descriptions","label":"#080 Slowbro","desc":"Pokédex entry text for Slowbro","file":"data.js","text":"A Shellder bit its tail so hard it became one with Slowbro! It is very happy and a bit dreamy now."},{"cat":"Pokémon names","label":"#081 name","desc":"The name shown for Pokémon #81","file":"data.js","text":"Magnemite"},{"cat":"Pokédex descriptions","label":"#081 Magnemite","desc":"Pokédex entry text for Magnemite","file":"data.js","text":"Floats using magnetism. It is drawn toward people and pets by their body's electrical charge."},{"cat":"Pokémon names","label":"#082 name","desc":"The name shown for Pokémon #82","file":"data.js","text":"Magneton"},{"cat":"Pokédex descriptions","label":"#082 Magneton","desc":"Pokédex entry text for Magneton","file":"data.js","text":"Three units linked by magnetism. The radio waves they emit can raise the temperature nearby."},{"cat":"Pokémon names","label":"#083 name","desc":"The name shown for Pokémon #83","file":"data.js","text":"Farfetch'd"},{"cat":"Pokédex descriptions","label":"#083 Farfetch'd","desc":"Pokédex entry text for Farfetch'd","file":"data.js","text":"It cannot live without the stalk it holds, and guards that precious plant with its life."},{"cat":"Pokémon names","label":"#084 name","desc":"The name shown for Pokémon #84","file":"data.js","text":"Doduo"},{"cat":"Pokédex descriptions","label":"#084 Doduo","desc":"Pokédex entry text for Doduo","file":"data.js","text":"Its two heads never sleep at once, watching for enemies even as it sprints across the plains."},{"cat":"Pokémon names","label":"#085 name","desc":"The name shown for Pokémon #85","file":"data.js","text":"Dodrio"},{"cat":"Pokédex descriptions","label":"#085 Dodrio","desc":"Pokédex entry text for Dodrio","file":"data.js","text":"One head shows joy, one sorrow, one anger. It can run at nearly 40 miles per hour."},{"cat":"Pokémon names","label":"#086 name","desc":"The name shown for Pokémon #86","file":"data.js","text":"Seel"},{"cat":"Pokédex descriptions","label":"#086 Seel","desc":"Pokédex entry text for Seel","file":"data.js","text":"Loves to sleep in icy water. The colder the weather, the more active and lively it becomes!"},{"cat":"Pokémon names","label":"#087 name","desc":"The name shown for Pokémon #87","file":"data.js","text":"Dewgong"},{"cat":"Pokédex descriptions","label":"#087 Dewgong","desc":"Pokédex entry text for Dewgong","file":"data.js","text":"Loves to snooze on cold ice. The colder the weather, the friskier it becomes! It loves icy cold water."},{"cat":"Pokémon names","label":"#088 name","desc":"The name shown for Pokémon #88","file":"data.js","text":"Grimer"},{"cat":"Pokédex descriptions","label":"#088 Grimer","desc":"Pokédex entry text for Grimer","file":"data.js","text":"Born from sludge, it thrives on filth. Wherever it slithers, germ-ridden grime is left behind."},{"cat":"Pokémon names","label":"#089 name","desc":"The name shown for Pokémon #89","file":"data.js","text":"Muk"},{"cat":"Pokédex descriptions","label":"#089 Muk","desc":"Pokédex entry text for Muk","file":"data.js","text":"It smells so awful it can cause fainting. Thankfully none live where the stench could spread."},{"cat":"Pokémon names","label":"#090 name","desc":"The name shown for Pokémon #90","file":"data.js","text":"Shellder"},{"cat":"Pokédex descriptions","label":"#090 Shellder","desc":"Pokédex entry text for Shellder","file":"data.js","text":"Its hard shell deflects any attack. The tongue that hangs from its mouth can snap shut fast."},{"cat":"Pokémon names","label":"#091 name","desc":"The name shown for Pokémon #91","file":"data.js","text":"Cloyster"},{"cat":"Pokédex descriptions","label":"#091 Cloyster","desc":"Pokédex entry text for Cloyster","file":"data.js","text":"It shoots spikes from inside its shell at enemies. Its powerful shell cannot be opened from outside!"},{"cat":"Pokémon names","label":"#092 name","desc":"The name shown for Pokémon #92","file":"data.js","text":"Gastly"},{"cat":"Pokédex descriptions","label":"#092 Gastly","desc":"Pokédex entry text for Gastly","file":"data.js","text":"Almost invisible, this gaseous Pokémon wraps its opponent in poisonous gas and puts it to sleep."},{"cat":"Pokémon names","label":"#093 name","desc":"The name shown for Pokémon #93","file":"data.js","text":"Haunter"},{"cat":"Pokédex descriptions","label":"#093 Haunter","desc":"Pokédex entry text for Haunter","file":"data.js","text":"It loves to hide and pop out to scare people! Its gaseous body can pass through any object freely."},{"cat":"Pokémon names","label":"#094 name","desc":"The name shown for Pokémon #94","file":"data.js","text":"Gengar"},{"cat":"Pokédex descriptions","label":"#094 Gengar","desc":"Pokédex entry text for Gengar","file":"data.js","text":"Under a full moon, this Pokémon likes to mimic the shadows of people and laugh at their fright!"},{"cat":"Pokémon names","label":"#095 name","desc":"The name shown for Pokémon #95","file":"data.js","text":"Onix"},{"cat":"Pokédex descriptions","label":"#095 Onix","desc":"Pokédex entry text for Onix","file":"data.js","text":"A massive rock snake that tunnels underground at 50 mph. Its body hardens into black diamonds over years!"},{"cat":"Pokémon names","label":"#096 name","desc":"The name shown for Pokémon #96","file":"data.js","text":"Drowzee"},{"cat":"Pokédex descriptions","label":"#096 Drowzee","desc":"Pokédex entry text for Drowzee","file":"data.js","text":"If your nose itches while you sleep, a Drowzee is probably nearby, nibbling on your dreams."},{"cat":"Pokémon names","label":"#097 name","desc":"The name shown for Pokémon #97","file":"data.js","text":"Hypno"},{"cat":"Pokédex descriptions","label":"#097 Hypno","desc":"Pokédex entry text for Hypno","file":"data.js","text":"It swings a pendulum to lull foes to sleep, then feasts on their dreams as they slumber."},{"cat":"Pokémon names","label":"#098 name","desc":"The name shown for Pokémon #98","file":"data.js","text":"Krabby"},{"cat":"Pokédex descriptions","label":"#098 Krabby","desc":"Pokédex entry text for Krabby","file":"data.js","text":"Its pincers are both weapons and communication tools — it waves them to send signals."},{"cat":"Pokémon names","label":"#099 name","desc":"The name shown for Pokémon #99","file":"data.js","text":"Kingler"},{"cat":"Pokédex descriptions","label":"#099 Kingler","desc":"Pokédex entry text for Kingler","file":"data.js","text":"Its oversized claw is enormously powerful, but so heavy it tires quickly when used too long."},{"cat":"Pokémon names","label":"#100 name","desc":"The name shown for Pokémon #100","file":"data.js","text":"Voltorb"},{"cat":"Pokédex descriptions","label":"#100 Voltorb","desc":"Pokédex entry text for Voltorb","file":"data.js","text":"Looks exactly like a PokéBall. It was first discovered in a power plant. Explodes at the slightest touch."},{"cat":"Pokémon names","label":"#101 name","desc":"The name shown for Pokémon #101","file":"data.js","text":"Electrode"},{"cat":"Pokédex descriptions","label":"#101 Electrode","desc":"Pokédex entry text for Electrode","file":"data.js","text":"It stores electricity, then discharges it at the slightest stimulation. Bumping it is risky."},{"cat":"Pokémon names","label":"#102 name","desc":"The name shown for Pokémon #102","file":"data.js","text":"Exeggcute"},{"cat":"Pokédex descriptions","label":"#102 Exeggcute","desc":"Pokédex entry text for Exeggcute","file":"data.js","text":"It looks like six eggs, but the heads call to each other and gather as a single unit."},{"cat":"Pokémon names","label":"#103 name","desc":"The name shown for Pokémon #103","file":"data.js","text":"Exeggutor"},{"cat":"Pokédex descriptions","label":"#103 Exeggutor","desc":"Pokédex entry text for Exeggutor","file":"data.js","text":"Its three heads think independently but work in harmony. The heads sometimes disagree on direction!"},{"cat":"Pokémon names","label":"#104 name","desc":"The name shown for Pokémon #104","file":"data.js","text":"Cubone"},{"cat":"Pokédex descriptions","label":"#104 Cubone","desc":"Pokédex entry text for Cubone","file":"data.js","text":"It always wears the skull of its dead mother. On the night of a full moon, it cries for her."},{"cat":"Pokémon names","label":"#105 name","desc":"The name shown for Pokémon #105","file":"data.js","text":"Marowak"},{"cat":"Pokédex descriptions","label":"#105 Marowak","desc":"Pokédex entry text for Marowak","file":"data.js","text":"It carries the skull of its lost mother as a weapon. A kind touch can ease its lonely, aching heart."},{"cat":"Pokémon names","label":"#106 name","desc":"The name shown for Pokémon #106","file":"data.js","text":"Hitmonlee"},{"cat":"Pokédex descriptions","label":"#106 Hitmonlee","desc":"Pokédex entry text for Hitmonlee","file":"data.js","text":"Its legs stretch and contract freely. It can circle a foe, hammering with rapid kicks."},{"cat":"Pokémon names","label":"#107 name","desc":"The name shown for Pokémon #107","file":"data.js","text":"Hitmonchan"},{"cat":"Pokédex descriptions","label":"#107 Hitmonchan","desc":"Pokédex entry text for Hitmonchan","file":"data.js","text":"Its punches slice the air, yet it must rest briefly after fighting at full power."},{"cat":"Pokémon names","label":"#108 name","desc":"The name shown for Pokémon #108","file":"data.js","text":"Lickitung"},{"cat":"Pokédex descriptions","label":"#108 Lickitung","desc":"Pokédex entry text for Lickitung","file":"data.js","text":"Its long tongue, twice its body length, can grab things; a lick may leave a tingle."},{"cat":"Pokémon names","label":"#109 name","desc":"The name shown for Pokémon #109","file":"data.js","text":"Koffing"},{"cat":"Pokédex descriptions","label":"#109 Koffing","desc":"Pokédex entry text for Koffing","file":"data.js","text":"It floats by filling itself with toxic gases. The thinner its skin, the more dangerous it is."},{"cat":"Pokémon names","label":"#110 name","desc":"The name shown for Pokémon #110","file":"data.js","text":"Weezing"},{"cat":"Pokédex descriptions","label":"#110 Weezing","desc":"Pokédex entry text for Weezing","file":"data.js","text":"Two kinds of gas churn inside its twin bodies, and mixing them can make it swell and burst."},{"cat":"Pokémon names","label":"#111 name","desc":"The name shown for Pokémon #111","file":"data.js","text":"Rhyhorn"},{"cat":"Pokédex descriptions","label":"#111 Rhyhorn","desc":"Pokédex entry text for Rhyhorn","file":"data.js","text":"Its armor-like hide is so tough it ignores any hit. It can even crumble a building just by charging!"},{"cat":"Pokémon names","label":"#112 name","desc":"The name shown for Pokémon #112","file":"data.js","text":"Rhydon"},{"cat":"Pokédex descriptions","label":"#112 Rhydon","desc":"Pokédex entry text for Rhydon","file":"data.js","text":"Covered in armor-like hide, this Pokémon can topple a building with one swing of its powerful tail."},{"cat":"Pokémon names","label":"#113 name","desc":"The name shown for Pokémon #113","file":"data.js","text":"Chansey"},{"cat":"Pokédex descriptions","label":"#113 Chansey","desc":"Pokédex entry text for Chansey","file":"data.js","text":"Lays high-nutrition eggs every day. It is kind and shares its eggs generously with injured Pokémon."},{"cat":"Pokémon names","label":"#114 name","desc":"The name shown for Pokémon #114","file":"data.js","text":"Tangela"},{"cat":"Pokédex descriptions","label":"#114 Tangela","desc":"Pokédex entry text for Tangela","file":"data.js","text":"Its whole body is wrapped in thick blue vines. Nobody has ever seen the face hidden behind them!"},{"cat":"Pokémon names","label":"#115 name","desc":"The name shown for Pokémon #115","file":"data.js","text":"Kangaskhan"},{"cat":"Pokédex descriptions","label":"#115 Kangaskhan","desc":"Pokédex entry text for Kangaskhan","file":"data.js","text":"The baby in the pouch leaves after three years. The mother fiercely protects it at all costs."},{"cat":"Pokémon names","label":"#116 name","desc":"The name shown for Pokémon #116","file":"data.js","text":"Horsea"},{"cat":"Pokédex descriptions","label":"#116 Horsea","desc":"Pokédex entry text for Horsea","file":"data.js","text":"It can swim in any direction including upside down. It squirts ink to escape enemies."},{"cat":"Pokémon names","label":"#117 name","desc":"The name shown for Pokémon #117","file":"data.js","text":"Seadra"},{"cat":"Pokédex descriptions","label":"#117 Seadra","desc":"Pokédex entry text for Seadra","file":"data.js","text":"It makes huge whirlpools by spinning its body. Anything caught in the whirlpool is dragged to the bottom!"},{"cat":"Pokémon names","label":"#118 name","desc":"The name shown for Pokémon #118","file":"data.js","text":"Goldeen"},{"cat":"Pokédex descriptions","label":"#118 Goldeen","desc":"Pokédex entry text for Goldeen","file":"data.js","text":"Beautiful but ferocious. One flap of its powerful fin can knock a person clean off their feet."},{"cat":"Pokémon names","label":"#119 name","desc":"The name shown for Pokémon #119","file":"data.js","text":"Seaking"},{"cat":"Pokédex descriptions","label":"#119 Seaking","desc":"Pokédex entry text for Seaking","file":"data.js","text":"It drills holes in river boulders using its horn to make a nest. It protects its eggs fiercely!"},{"cat":"Pokémon names","label":"#120 name","desc":"The name shown for Pokémon #120","file":"data.js","text":"Staryu"},{"cat":"Pokédex descriptions","label":"#120 Staryu","desc":"Pokédex entry text for Staryu","file":"data.js","text":"The red gem at its center glows at night. It can regenerate any part of its body that breaks off."},{"cat":"Pokémon names","label":"#121 name","desc":"The name shown for Pokémon #121","file":"data.js","text":"Starmie"},{"cat":"Pokédex descriptions","label":"#121 Starmie","desc":"Pokédex entry text for Starmie","file":"data.js","text":"Its core glows in seven colors like a rainbow jewel! Nobody knows what the glowing center gem is for."},{"cat":"Pokémon names","label":"#122 name","desc":"The name shown for Pokémon #122","file":"data.js","text":"Mr. Mime"},{"cat":"Pokédex descriptions","label":"#122 Mr. Mime","desc":"Pokédex entry text for Mr. Mime","file":"data.js","text":"A master of mime, it can shape invisible walls in the air that even fire and water cannot pass."},{"cat":"Pokémon names","label":"#123 name","desc":"The name shown for Pokémon #123","file":"data.js","text":"Scyther"},{"cat":"Pokédex descriptions","label":"#123 Scyther","desc":"Pokédex entry text for Scyther","file":"data.js","text":"So blindingly fast it becomes invisible. Its razor-sharp scythes can slice through thick logs."},{"cat":"Pokémon names","label":"#124 name","desc":"The name shown for Pokémon #124","file":"data.js","text":"Jynx"},{"cat":"Pokédex descriptions","label":"#124 Jynx","desc":"Pokédex entry text for Jynx","file":"data.js","text":"It moves with a rhythmic sway and sings a strange melody that makes everyone around it want to dance!"},{"cat":"Pokémon names","label":"#125 name","desc":"The name shown for Pokémon #125","file":"data.js","text":"Electabuzz"},{"cat":"Pokédex descriptions","label":"#125 Electabuzz","desc":"Pokédex entry text for Electabuzz","file":"data.js","text":"When a storm nears, it gathers on tall towers to feed on the lightning, glowing faintly."},{"cat":"Pokémon names","label":"#126 name","desc":"The name shown for Pokémon #126","file":"data.js","text":"Magmar"},{"cat":"Pokédex descriptions","label":"#126 Magmar","desc":"Pokédex entry text for Magmar","file":"data.js","text":"Its fiery breath reaches incredibly high temperatures. It is found near volcanoes and magma springs."},{"cat":"Pokémon names","label":"#127 name","desc":"The name shown for Pokémon #127","file":"data.js","text":"Pinsir"},{"cat":"Pokédex descriptions","label":"#127 Pinsir","desc":"Pokédex entry text for Pinsir","file":"data.js","text":"It grabs prey with its huge pincers and will not let go until the prey splits in two."},{"cat":"Pokémon names","label":"#128 name","desc":"The name shown for Pokémon #128","file":"data.js","text":"Tauros"},{"cat":"Pokédex descriptions","label":"#128 Tauros","desc":"Pokédex entry text for Tauros","file":"data.js","text":"It charges at over 30 miles per hour, whipping itself with its three tails to stay furious."},{"cat":"Pokémon names","label":"#129 name","desc":"The name shown for Pokémon #129","file":"data.js","text":"Magikarp"},{"cat":"Pokédex descriptions","label":"#129 Magikarp","desc":"Pokédex entry text for Magikarp","file":"data.js","text":"In the distant past, it was somewhat stronger. Today it is the weakest — but it never gives up!"},{"cat":"Pokémon names","label":"#130 name","desc":"The name shown for Pokémon #130","file":"data.js","text":"Gyarados"},{"cat":"Pokédex descriptions","label":"#130 Gyarados","desc":"Pokédex entry text for Gyarados","file":"data.js","text":"Once it appears, its rage rarely subsides until everything nearby is destroyed. Sailors fear it."},{"cat":"Pokémon names","label":"#131 name","desc":"The name shown for Pokémon #131","file":"data.js","text":"Lapras"},{"cat":"Pokédex descriptions","label":"#131 Lapras","desc":"Pokédex entry text for Lapras","file":"data.js","text":"A gentle giant that understands human speech and happily carries people across the sea."},{"cat":"Pokémon names","label":"#132 name","desc":"The name shown for Pokémon #132","file":"data.js","text":"Ditto"},{"cat":"Pokédex descriptions","label":"#132 Ditto","desc":"Pokédex entry text for Ditto","file":"data.js","text":"When it encounters an enemy, its body instantly transforms into a perfect copy of that foe."},{"cat":"Pokémon names","label":"#133 name","desc":"The name shown for Pokémon #133","file":"data.js","text":"Eevee"},{"cat":"Pokédex descriptions","label":"#133 Eevee","desc":"Pokédex entry text for Eevee","file":"data.js","text":"Its genetic code is special. It may evolve into many different Pokémon when exposed to special Stones."},{"cat":"Pokémon names","label":"#134 name","desc":"The name shown for Pokémon #134","file":"data.js","text":"Vaporeon"},{"cat":"Pokédex descriptions","label":"#134 Vaporeon","desc":"Pokédex entry text for Vaporeon","file":"data.js","text":"It melts into water making enemies lose sight of it! It can also predict rainstorms by feeling the air."},{"cat":"Pokémon names","label":"#135 name","desc":"The name shown for Pokémon #135","file":"data.js","text":"Jolteon"},{"cat":"Pokédex descriptions","label":"#135 Jolteon","desc":"Pokédex entry text for Jolteon","file":"data.js","text":"Its cells generate weak power that its fur amplifies, firing off lightning-fast bolts when it leaps."},{"cat":"Pokémon names","label":"#136 name","desc":"The name shown for Pokémon #136","file":"data.js","text":"Flareon"},{"cat":"Pokédex descriptions","label":"#136 Flareon","desc":"Pokédex entry text for Flareon","file":"data.js","text":"It stores thermal energy in its fluffy fur, then exhales fire that can reach 3,000 degrees!"},{"cat":"Pokémon names","label":"#137 name","desc":"The name shown for Pokémon #137","file":"data.js","text":"Porygon"},{"cat":"Pokédex descriptions","label":"#137 Porygon","desc":"Pokédex entry text for Porygon","file":"data.js","text":"A Pokémon made entirely of programming code. The only artificial Pokémon ever created."},{"cat":"Pokémon names","label":"#138 name","desc":"The name shown for Pokémon #138","file":"data.js","text":"Omanyte"},{"cat":"Pokédex descriptions","label":"#138 Omanyte","desc":"Pokédex entry text for Omanyte","file":"data.js","text":"An ancient Pokémon revived from a fossil. It uses its tentacles to capture prey in the sea."},{"cat":"Pokémon names","label":"#139 name","desc":"The name shown for Pokémon #139","file":"data.js","text":"Omastar"},{"cat":"Pokédex descriptions","label":"#139 Omastar","desc":"Pokédex entry text for Omastar","file":"data.js","text":"A prehistoric Pokémon that used sharp fangs and tentacles to ensnare prey in ancient seas."},{"cat":"Pokémon names","label":"#140 name","desc":"The name shown for Pokémon #140","file":"data.js","text":"Kabuto"},{"cat":"Pokédex descriptions","label":"#140 Kabuto","desc":"Pokédex entry text for Kabuto","file":"data.js","text":"Revived from a fossil, it has barely changed in three hundred million years of existence."},{"cat":"Pokémon names","label":"#141 name","desc":"The name shown for Pokémon #141","file":"data.js","text":"Kabutops"},{"cat":"Pokédex descriptions","label":"#141 Kabutops","desc":"Pokédex entry text for Kabutops","file":"data.js","text":"It swam to hunt, slicing prey with its sharp sickles and draining their fluids in ancient seas."},{"cat":"Pokémon names","label":"#142 name","desc":"The name shown for Pokémon #142","file":"data.js","text":"Aerodactyl"},{"cat":"Pokédex descriptions","label":"#142 Aerodactyl","desc":"Pokédex entry text for Aerodactyl","file":"data.js","text":"A ferocious Pokémon revived from amber. It once soared the ancient skies, fangs bared."},{"cat":"Pokémon names","label":"#143 name","desc":"The name shown for Pokémon #143","file":"data.js","text":"Snorlax"},{"cat":"Pokédex descriptions","label":"#143 Snorlax","desc":"Pokédex entry text for Snorlax","file":"data.js","text":"Very lazy. Just eats and sleeps. As its huge body gets bigger, it becomes steadily more sleepy."},{"cat":"Pokémon names","label":"#144 name","desc":"The name shown for Pokémon #144","file":"data.js","text":"Articuno"},{"cat":"Pokédex descriptions","label":"#144 Articuno","desc":"Pokédex entry text for Articuno","file":"data.js","text":"A legendary bird Pokémon that can control ice. It chills moisture in the ght buddy","file":"game.js","text":"Bring a 🌍 Ground Pokémon as your buddy to clear the sand wall!"},{"cat":"Barriers","label":"sand — cleared","desc":"Shown when you clear the \"sand\" barrier","file":"game.js","text":"🌍 Your Ground buddy clears the sand wall!"},{"cat":"Barriers","label":"psychic — blocked hint","desc":"Shown when you hit the \"psychic\" barrier without the right buddy","file":"game.js","text":"🔮 A barrier of pure psychic force seals the path north. Only an ULTRA-POWERFUL Psychic-type — the very strongest of all — may pass."},{"cat":"Barriers","label":"psychic — cleared","desc":"Shown when you clear the \"psychic\" barrier","file":"game.js","text":"🔮 Mewtwo flares with unimaginable psychic power... the barrier dissolves!"},{"cat":"Barriers","label":"lullaby — blocked hint","desc":"Shown when you hit the \"lullaby\" barrier without the right buddy","file":"game.js","text":"🔥 An enormous Gigantamax Charizard blocks this path! He's too dangerous to fight... Maybe he needs a nap!"},{"cat":"Barriers","label":"lullaby — cleared","desc":"Shown when you clear the \"lullaby\" barrier","file":"game.js","text":"🎵 Jigglypuff's lullaby drifts over the giant... its blue inferno fades to gentle embers and it slumps into a deep, rumbling sleep."},{"cat":"Field notes","label":"tip: Winning hearts","desc":"A field-note tip title","file":"game.js","text":"Winning hearts"},{"cat":"Field notes","label":"tip text: Winning hearts","desc":"Body of the \"Winning hearts\" field note","file":"game.js","text":"Wild Lukeymon want kindness, not force. Feed 🍎, Pet 🤚 or Play ⚽ to read their mood and fill the heart meter — then throw a Ball."},{"cat":"Field notes","label":"tip: Pick a buddy","desc":"A field-note tip title","file":"game.js","text":"Pick a buddy"},{"cat":"Field notes","label":"tip text: Pick a buddy","desc":"Body of the \"Pick a buddy\" field note","file":"game.js","text":"Set a buddy from the Pokédex (tap the ❤️) or the HUD. It follows you, and its TYPE is the key to barriers, surfing and cave-light."},{"cat":"Field notes","label":"tip: Send the counter","desc":"A field-note tip title","file":"game.js","text":"Send the counter"},{"cat":"Field notes","label":"tip text: Send the counter","desc":"Body of the \"Send the counter\" field note","file":"game.js","text":"Legendary guardians demand a TYPE each round. Send out a buddy whose type is SUPER-EFFECTIVE against it to win the exchange."},{"cat":"Field notes","label":"tip: Slippery ice","desc":"A field-note tip title","file":"game.js","text":"Slippery ice"},{"cat":"Field notes","label":"tip text: Slippery ice","desc":"Body of the \"Slippery ice\" field note","file":"game.js","text":"Step on ice without an Ice-type buddy and you slide straight across until something stops you. An Ice buddy keeps your footing so you can walk."},{"cat":"Field notes","label":"tip: Surf the water","desc":"A field-note tip title","file":"game.js","text":"Surf the water"},{"cat":"Field notes","label":"tip text: Surf the water","desc":"Body of the \"Surf the water\" field note","file":"game.js","text":"Deep water blocks the way — unless a Water-type buddy is following. Then you hop on and surf right across."},{"cat":"Field notes","label":"tip: Dark caves","desc":"A field-note tip title","file":"game.js","text":"Dark caves"},{"cat":"Field notes","label":"tip text: Dark caves","desc":"Body of the \"Dark caves\" field note","file":"game.js","text":"Caves are pitch black. Bring a glowing buddy (a Fire-type works well) to light up the path around you."},{"cat":"Field notes","label":"tip: Speed runners","desc":"A field-note tip title","file":"game.js","text":"Speed runners"},{"cat":"Field notes","label":"tip text: Speed runners","desc":"Body of the \"Speed runners\" field note","file":"game.js","text":"A few Lukeymon are built for speed — Rapidash and Dodrio. Set one as your buddy and you DASH across the world, covering ground much faster."},{"cat":"Badges","label":"badge_volcano","desc":"Name of badge \"badge_volcano\"","file":"game.js","text":"Ember Badge"},{"cat":"Badges","label":"badge_forest","desc":"Name of badge \"badge_forest\"","file":"game.js","text":"Thicket Badge"},{"cat":"Badges","label":"badge_ice","desc":"Name of badge \"badge_ice\"","file":"game.js","text":"Glacier Badge"},{"cat":"Badges","label":"badge_desert","desc":"Name of badge \"badge_desert\"","file":"game.js","text":"Dune Badge"},{"cat":"Badges","label":"badge_safari","desc":"Name of badge \"badge_safari\"","file":"game.js","text":"Savanna Badge"},{"cat":"Badges","label":"badge_frost","desc":"Name of badge \"badge_frost\"","file":"game.js","text":"Frost Badge"},{"cat":"Badges","label":"badge_spirit","desc":"Name of badge \"badge_spirit\"","file":"game.js","text":"Spirit Badge"},{"cat":"Badges","label":"badge_cavern","desc":"Name of badge \"badge_cavern\"","file":"game.js","text":"Cavern Badge"},{"cat":"Badges","label":"badge_tunnel","desc":"Name of badge \"badge_tunnel\"","file":"game.js","text":"Tunnel Badge"},{"cat":"Badges","label":"badge_crystal","desc":"Name of badge \"badge_crystal\"","file":"game.js","text":"Crystal Badge"},{"cat":"Badges","label":"badge_echo","desc":"Name of badge \"badge_echo\"","file":"game.js","text":"Echo Badge"},{"cat":"Badges","label":"badge_lullaby","desc":"Name of badge \"badge_lullaby\"","file":"game.js","text":"Lullaby Badge"},{"cat":"Badges","label":"badge_gym","desc":"Name of badge \"badge_gym\"","file":"game.js","text":"Rumble Badge"},{"cat":"Badges","label":"badge_trio","desc":"Name of badge \"badge_trio\"","file":"game.js","text":"Trio Badge"},{"cat":"Items (stones)","label":"thunder stone","desc":"Evolution stone name","file":"game.js","text":"Thunder Stone"},{"cat":"Items (stones)","label":"fire stone","desc":"Evolution stone name","file":"game.js","text":"Fire Stone"},{"cat":"Items (stones)","label":"water stone","desc":"Evolution stone name","file":"game.js","text":"Water Stone"},{"cat":"Items (stones)","label":"leaf stone","desc":"Evolution stone name","file":"game.js","text":"Leaf Stone"},{"cat":"Items (stones)","label":"moon stone","desc":"Evolution stone name","file":"game.js","text":"Moon Stone"},{"cat":"NPC dialogue — Dad","label":"Dad line 1","desc":"A line Dad says. (${saveName} = the player's name.)","file":"game.js","text":"...${saveName}? Is that you? You made it! Congratulations!"},{"cat":"NPC dialogue — Dad","label":"Dad line 2","desc":"A line Dad says. (${saveName} = the player's name.)","file":"game.js","text":"You made friends with every single Lukeymon — all 151. Even Mewtwo chose to walk beside you."},{"cat":"NPC dialogue — Dad","label":"Dad line 3","desc":"A line Dad says. (${saveName} = the player's name.)","file":"game.js","text":"Lukeymon island is your playground, I hope you had fun!"},{"cat":"NPC dialogue — Dad","label":"Dad line 4","desc":"A line Dad says. (${saveName} = the player's name.)","file":"game.js","text":"I am SO proud of you. You're the kindest, bravest trainer this world has ever known."},{"cat":"NPC dialogue — Dad","label":"Dad line 5","desc":"A line Dad says. (${saveName} = the player's name.)","file":"game.js","text":"NOW COME GET A HUG YOU CHICKEN-BUTT. I love you!"},{"cat":"NPC dialogue — Prof. Birch","label":"Prof. Birch line 1","desc":"A line Prof. Birch says. (${saveName} = the player's name.)","file":"game.js","text":"Good to see you out and about, ${saveName}!"},{"cat":"NPC dialogue — Prof. Birch","label":"Prof. Birch line 2","desc":"A line Prof. Birch says. (${saveName} = the player's name.)","file":"game.js","text":"Befriend a wild Lukeymon with the action it wants — Feed 🍎, Pet 🤚, or Play ⚽."},{"cat":"NPC dialogue — Prof. Birch","label":"Prof. Birch line 3","desc":"A line Prof. Birch says. (${saveName} = the player's name.)","file":"game.js","text":"Some paths are blocked, ${saveName}. Catch the right TYPE, then WALK INTO the barrier to clear it!"},{"cat":"NPC dialogue — Officer","label":"Officer line 1","desc":"A line Officer says. (${saveName} = the player's name.)","file":"game.js","text":"Keeping the city safe, ${saveName}."},{"cat":"NPC dialogue — Officer","label":"Officer line 2","desc":"A line Officer says. (${saveName} = the player's name.)","file":"game.js","text":"They say rare BADGES are hidden out in the faraway lands... Volcano, Desert, the icy caves."},{"cat":"NPC dialogue — Surfer","label":"Surfer line 1","desc":"A line Surfer says. (${saveName} = the player's name.)","file":"game.js","text":"Waves are perfect today, ${saveName}!"},{"cat":"NPC dialogue — Surfer","label":"Surfer line 2","desc":"A line Surfer says. (${saveName} = the player's name.)","file":"game.js","text":"Water Lukeymon really love a gentle pet. 🤚"},{"cat":"NPC dialogue — Hermit","label":"Hermit line 1","desc":"A line Hermit says. (${saveName} = the player's name.)","file":"game.js","text":"...you wandered this deep into the forest, ${saveName}? Impressive."},{"cat":"NPC dialogue — Hermit","label":"Hermit line 2","desc":"A line Hermit says. (${saveName} = the player's name.)","file":"game.js","text":"Collect every badge AND every Lukeymon, ${saveName}, and you will be a true master."},{"cat":"NPC dialogue — Ash","label":"Ash line 1","desc":"A line Ash says. (${saveName} = the player's name.)","file":"game.js","text":"You caught them ALL, ${saveName}?! You're a true Lukeymon Master! 🌟"},{"cat":"NPC dialogue — Ash","label":"Ash line 2","desc":"A line Ash says. (${saveName} = the player's name.)","file":"game.js","text":"You're the CHAMPION now! 🏆"},{"cat":"NPC dialogue — Ash","label":"Ash line 3","desc":"A line Ash says. (${saveName} = the player's name.)","file":"game.js","text":"Still out there: the legendary birds, Mew & Mewtwo, and a full Pokédex."},{"cat":"NPC dialogue — Ash","label":"Ash line 4","desc":"A line Ash says. (${saveName} = the player's name.)","file":"game.js","text":"The adventure's not over — go get 'em!"},{"cat":"NPC dialogue — Ash","label":"Ash line 5","desc":"A line Ash says. (${saveName} = the player's name.)","file":"g STRINGS.forEach((s,i)=>s._i=i);
const cats=[...new Set(STRINGS.map(s=>s.cat))];
const catSel=document.getElementById('cat'); cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c+' ('+STRINGS.filter(s=>s.cat===c).length+')';catSel.appendChild(o);});
const list=document.getElementById('list'), q=document.getElementById('q'), countEl=document.getElementById('count');
const edits={};
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(){
 const term=q.value.toLowerCase(), fc=catSel.value;
 list.innerHTML=''; let shown=0; let curCat=null, sec=null;
 STRINGS.forEach(s=>{
  if(fc&&s.cat!==fc)return;
  if(term&&!(s.text.toLowerCase().includes(term)||s.label.toLowerCase().includes(term)||s.cat.toLowerCase().includes(term)))return;
  shown++;
  if(s.cat!==curCat){curCat=s.cat;sec=document.createElement('div');sec.className='sec';sec.innerHTML='<h2>'+esc(s.cat)+'</h2>';list.appendChild(sec);}
  const row=document.createElement('div'); row.className='row'+(edits[s._i]!=null?' changed':'');
  row.innerHTML='<span class="file">'+s.file+'</span><div class="lbl">'+esc(s.label)+'</div><div class="desc">'+esc(s.desc)+'</div>';
  const ta=document.createElement('textarea'); ta.value=edits[s._i]!=null?edits[s._i]:s.text;
  ta.addEventListener('input',()=>{ if(ta.value!==s.text){edits[s._i]=ta.value;row.classList.add('changed');} else {delete edits[s._i];row.classList.remove('changed');} });
  ta.style.height=Math.max(38,18+Math.ceil(ta.value.length/60)*18)+'px';
  row.appendChild(ta); sec.appendChild(row);
 });
 countEl.textContent=shown+' / '+STRINGS.length;
}
q.oninput=render; catSel.onchange=render;
document.getElementById('export').onclick=()=>{
 const keys=Object.keys(edits);
 if(!keys.length){document.getElementById('out').value='(no edits yet — change some boxes first)';return;}
 const byFile={};
 keys.forEach(k=>{const s=STRINGS[k];(byFile[s.file]=byFile[s.file]||[]).push({label:s.label,old:s.text,new:edits[k]});});
 let t='# Lukeymon string edits — '+keys.length+' change(s)\n';
 Object.keys(byFile).forEach(f=>{ t+='\n## '+f+'\n'; byFile[f].forEach(e=>{ t+='\n['+e.label+']\nOLD: '+JSON.stringify(e.old)+'\nNEW: '+JSON.stringify(e.new)+'\n'; }); });
 const o=document.getElementById('out'); o.value=t; o.scrollIntoView({behavior:'smooth'}); navigator.clipboard&&navigator.clipboard.writeText(t);
};
